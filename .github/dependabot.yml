# Quiet by design: ready pull requests merge themselves and a merge to main
# deploys. One grouped minor/patch pull request per ecosystem each month,
# direct dependencies only, no major versions.
version: 2
updates:
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Pinned with deploy/viewer-release.json; upgraded through its own receipt.
      - dependency-name: "@subcult/archive-viewer"

  - package-ecosystem: docker
    directories:
      - /
      - /deploy
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      docker-minor-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Stay on the nginx stable branch (1.28); odd minors are mainline.
      - dependency-name: nginx
        update-types: ["version-update:semver-minor"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
