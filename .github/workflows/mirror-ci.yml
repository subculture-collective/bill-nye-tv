name: Mirror CI
run-name: Mirror CI ${{ github.sha }}
'on':
  push:
    branches-ignore:
    - main
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    if: github.repository == 'subculture-collective/bill-nye-tv'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - name: Set up Node
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: '24'
    - name: Install job-local pnpm
      shell: bash
      run: |
        set -euo pipefail
        tool_dir="$RUNNER_TEMP/pnpm-tool"
        npm install --prefix "$tool_dir" pnpm@10.33.0
        echo "$tool_dir/node_modules/.bin" >> "$GITHUB_PATH"
    - name: Locate the pnpm store
      id: pnpm-store
      shell: bash
      run: echo "path=$(pnpm --dir web store path --silent)" >> "$GITHUB_OUTPUT"
    - name: Restore the pnpm store
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: pnpm-store-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('web/pnpm-lock.yaml') }}
    - name: Run canonical verification
      run: make verify
  image:
    name: Build frontend image
    if: github.repository == 'subculture-collective/bill-nye-tv'
    needs:
    - verify
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - name: Build the frontend image from the verified revision
      shell: bash
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
        umask 077
        auth_dir=$(mktemp -d)
        trap 'rm -rf "$auth_dir"' EXIT
        export DOCKER_BUILDKIT=1
        # Registry location only; the shared package is readable anonymously.
        printf '%s\n' '@subcult:registry=https://git.subcult.tv/api/packages/subculture-collective/npm/' > "$auth_dir/npmrc"
        image="bill-nye-tv-frontend:$GITHUB_SHA"
        docker build -f deploy/frontend.Dockerfile --build-arg CORE_UPSTREAM=bill-core:8080 --secret id=npmrc,src="$auth_dir/npmrc" --label "org.opencontainers.image.revision=$GITHUB_SHA" -t "$image" .
        docker run --rm --network none --entrypoint nginx "$image" -t
  mirror-gate:
    name: Mirror CI gate
    if: always() && github.repository == 'subculture-collective/bill-nye-tv'
    needs:
    - verify
    - image
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - name: Require every verification job
      env:
        RESULTS: ${{ toJSON(needs) }}
      run: |
        python3 - <<'PY'
        import json, os
        results = json.loads(os.environ["RESULTS"])
        expected = {'verify', 'image'}
        assert set(results) == expected, results
        for name, result in results.items():
            assert result["result"] == "success", name + " did not pass"
        PY
